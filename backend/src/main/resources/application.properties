spring.application.name=transformer-twin
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transformer_twin?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.simulation.enabled=${SIMULATION_ENABLED:true}
app.simulation.interval-ms=${SIMULATION_INTERVAL_MS:5000}
app.simulation.seed=${SIMULATION_SEED:false}
app.health.minimum-coverage=${HEALTH_MINIMUM_COVERAGE:0.4}

# Demonstration triggers only; not IEC/CEA/OEM-prescribed operating limits. Configure from approved asset GTP before operational use.
app.demo.warning-hotspot-c=${WARNING_HOTSPOT_C:95}
app.demo.critical-hotspot-c=${CRITICAL_HOTSPOT_C:110}
app.demo.warning-load-percent=${WARNING_LOAD_PERCENT:100}

# Simplified IEC 60076-7-style thermal model defaults; replace with OEM heat-run data.
app.simulation.virtual-minutes-per-tick=${VIRTUAL_MINUTES_PER_TICK:1}
app.thermal.rated-top-oil-rise-k=${RATED_TOP_OIL_RISE_K:55}
app.thermal.rated-hotspot-gradient-k=${RATED_HOTSPOT_GRADIENT_K:25}
app.thermal.oil-time-constant-min=${OIL_TIME_CONSTANT_MIN:180}
app.thermal.winding-time-constant-min=${WINDING_TIME_CONSTANT_MIN:7}
app.thermal.loss-ratio=${TRANSFORMER_LOSS_RATIO:5}
app.thermal.oil-exponent=${OIL_EXPONENT:0.8}
app.thermal.winding-exponent=${WINDING_EXPONENT:1.6}
app.health.telemetry-stale-seconds=${TELEMETRY_STALE_SECONDS:30}
app.health.dga-fresh-days=${DGA_FRESH_DAYS:30}
app.health.oil-test-fresh-days=${OIL_TEST_FRESH_DAYS:180}
app.telemetry.rollup-cron=${TELEMETRY_ROLLUP_CRON:0 15 2 * * *}
