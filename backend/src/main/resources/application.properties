
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transformer_twin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.simulation.enabled=${SIMULATION_ENABLED:true}
app.simulation.interval-ms=${SIMULATION_INTERVAL_MS:5000}
app.simulation.warning-hotspot-c=${WARNING_HOTSPOT_C:95}
app.simulation.critical-hotspot-c=${CRITICAL_HOTSPOT_C:110}
app.simulation.warning-load-percent=${WARNING_LOAD_PERCENT:100}
